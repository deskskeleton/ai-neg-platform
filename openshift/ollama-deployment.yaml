# ============================================
# Ollama LLM Deployment for DSRI
# ============================================
# This manifest deploys in CPU mode so it applies in any GPU-quota state.
# CPU-only inference takes ~4 min per response and hits Ollama's 5-minute
# timeout, so a GPU is required for sessions. The DSRI GPU quota is 0 until
# a booking is active; when the booking email arrives, attach the GPU with
# the oc patch in DEPLOY.md step 6b. Re-applying this file removes the GPU
# again (and any node placement RCS added), so re-run the patch afterwards.
#
# On first deploy, pull the model:
#   POD=$(oc get pods -l app=ollama -o jsonpath='{.items[0].metadata.name}')
#   oc exec $POD -- ollama pull llama3.1:8b
#
# The PVC ensures the model persists across pod restarts.
# ============================================

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: ocs-storagecluster-cephfs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels:
    app: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
      annotations:
        io.kubernetes.cri-o.TrySkipVolumeSELinuxLabel: 'true'
    spec:
      runtimeClassName: selinux
      serviceAccountName: anyuid
      containers:
        - name: ollama
          image: ollama/ollama
          env:
            - name: OLLAMA_NUM_PARALLEL
              value: "4"
            # Pin the context window. Without this, Ollama auto-sizes based on
            # available VRAM — on an 80 GB H100 it picks 262144 tokens, which
            # balloons the KV cache (≈38 GB) and compute graph (≈35 GB) until
            # the 2.3 GB model weights no longer fit and cudaMalloc fails with
            # "device busy or unavailable". 8192 is plenty for 2–3 sentence
            # assistant replies in this experiment.
            - name: OLLAMA_CONTEXT_LENGTH
              value: "8192"
            # Model auto-pulled by the postStart hook below. Keep in sync with
            # LLM_MODEL on the neg-platform deployment.
            - name: LLM_MODEL
              value: "llama3.1:8b"
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          resources:
            requests:
              memory: "2Gi"
              cpu: "2"
            limits:
              memory: "4Gi"
              cpu: "4"
              # nvidia.com/gpu is NOT set here. The namespace GPU quota is 0 until
              # a DSRI booking is active, and a pod that requests a GPU with
              # quota 0 is never created. Add the GPU with the oc patch in
              # openshift/DEPLOY.md step 6b once the booking email arrives.
          # postStart: self-heal the model cache. If the PVC is empty (fresh
          # pod, new PV, or cache eviction), pull the configured model. If the
          # model is already present, `ollama pull` is a cheap no-op. We use
          # `ollama list` as the daemon-readiness probe because the ollama
          # binary is the only thing guaranteed to be in the upstream image
          # (no wget/curl).
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    for i in $(seq 1 30); do
                      if ollama list >/dev/null 2>&1; then
                        ollama pull "${LLM_MODEL:-llama3.1:8b}" && exit 0
                      fi
                      sleep 2
                    done
                    echo "ollama postStart: daemon did not come up in 60s" >&2
                    exit 0
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 60
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  labels:
    app: ollama
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
  type: ClusterIP
